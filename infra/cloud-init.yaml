#cloud-config
# Bootstraps the host on first boot. Kept in the repository so the deployment is
# readable rather than remembered: nothing about this server exists only in
# someone's shell history.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  # Docker from the official repository rather than the distro package, so the
  # compose plugin comes with it.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # MongoDB is reachable only from inside the compose network, so nothing but
  # SSH and the API port is open.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 4000/tcp
  - ufw --force enable

  - systemctl restart ssh
  - mkdir -p /srv/activity-weather-ranking
  - touch /var/lib/cloud-init-done
