# The reviewer runs this file, and so does production. Nothing about the
# deployment lives outside it.
services:
  api:
    build:
      context: .
      args:
        # `GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build` stamps
        # the image. Unset is fine and honest: the service then reports "unknown".
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - '${PORT:-4000}:4000'
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-activity_weather}
      GIT_SHA: ${GIT_SHA:-unknown}
      # How often the background refresher wakes. Ten minutes in normal running;
      # override it on the command line to watch the thing work without waiting
      # (README, "Watch the refresher"). Zero runs no refresher at all.
      REFRESH_INTERVAL_MS: ${REFRESH_INTERVAL_MS:-600000}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # The same GET the deploy script uses from outside, asked from inside. Without
      # it `restart: unless-stopped` only notices a process that exited, not one that
      # is running and answering nothing — and a hung API is the failure that looks
      # healthy. wget is busybox's; the runtime image has no curl.
      test:
        ['CMD-SHELL', 'wget -q -O - "http://127.0.0.1:4000/graphql?query=%7Bhealth%7D" || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      # Startup is short by construction: compose already waits for mongo to be
      # healthy, and the API opens the database before it binds the socket with a
      # 5 s server-selection timeout. Twenty seconds is that, with room.
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The API waits for this rather than retrying a connection on boot: a
      # container that exits because its dependency was slow is a false alarm.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mongo-data:
